name: Update Kaddafii Code Invaders

on:
  schedule:
    - cron: "17 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  arcade:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch GitHub contribution data
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api graphql \
            -f query='
              query($login:String!) {
                user(login:$login) {
                  contributionsCollection {
                    contributionCalendar {
                      totalContributions
                      weeks {
                        contributionDays {
                          date
                          contributionCount
                          weekday
                        }
                      }
                    }
                  }
                }
              }
            ' \
            -f login='Kaddafii' > arcade-output/github-data.json

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install Pillow
        run: python -m pip install pillow

      - name: Generate GIF using Kaddafii sprites
        run: python .github/scripts/generate_arcade.py

      - name: Publish GIF
        uses: crazy-max/ghaction-github-pages@v5
        with:
          build_dir: arcade-output
          target_branch: output
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
