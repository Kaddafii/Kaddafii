name: Update Kaddafii Code Invaders

on:
  schedule:
    - cron: "17 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  arcade:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create output directory
        run: mkdir -p arcade-output

      - name: Fetch GitHub contribution data
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api graphql \
            -f query='
              query($login:String!) {
                user(login:$login) {
                  contributionsCollection {
                    contributionCalendar {
                      totalContributions
                      weeks {
                        contributionDays {
                          date
                          contributionCount
                          weekday
                        }
                      }
                    }
                  }
                }
              }
            ' \
            -f login='Kaddafii' > arcade-output/github-data.json

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install Pillow and fonts
        run: |
          sudo apt-get update -y
          sudo apt-get install -y fonts-dejavu-core
          python -m pip install pillow

      - name: Generate arcade GIF
        run: python .github/scripts/generate_arcade.py

      - name: Publish arcade GIF to output branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          cp arcade-output/arcade.gif /tmp/arcade.gif

          git fetch origin output:output || true

          if git show-ref --verify --quiet refs/remotes/origin/output; then
            git checkout output
          else
            git checkout --orphan output
            git rm -rf . || true
          fi

          cp /tmp/arcade.gif ./arcade.gif
          git add arcade.gif

          if git diff --cached --quiet; then
            echo "No arcade changes to publish."
          else
            git commit -m "chore: update code invaders"
            git push origin output
          fi
